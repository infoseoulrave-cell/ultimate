<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #F7971E, #FFD200); color: #1a1a1a; display: flex; flex-direction: column; padding: 60px; overflow: hidden; }
  .header { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .num { font-size: 18px; font-weight: 700; opacity: 0.6; letter-spacing: 2px; }
  .emoji { font-size: 64px; margin-bottom: 12px; }
  .title { font-size: 52px; font-weight: 900; line-height: 1.2; margin-bottom: 6px; }
  .subtitle { font-size: 22px; font-weight: 400; opacity: 0.7; margin-bottom: 36px; letter-spacing: 1px; }
  .points { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .point { background: rgba(0,0,0,0.06); backdrop-filter: blur(10px); border-radius: 16px; padding: 18px 24px; font-size: 22px; line-height: 1.5; font-weight: 400; display: flex; align-items: center; gap: 14px; }
  .point-num { width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .tip { margin-top: 28px; padding: 20px 24px; background: rgba(0,0,0,0.08); border-radius: 16px; border-left: 4px solid #333; }
  .tip-label { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; margin-bottom: 6px; }
  .tip-text { font-size: 18px; line-height: 1.5; font-style: italic; }
  .footer { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; opacity: 0.5; font-size: 14px; }
</style></head>
<body>
  <div class="header"><span class="num">30 / 30</span></div>
  <div class="emoji">💡</div>
  <div class="title">창의력 향상법</div>
  <div class="subtitle">Boost Creativity</div>
  <div class="points">
    <div class="point"><span class="point-num">1</span>매일 드로잉·스케치 습관</div>
    <div class="point"><span class="point-num">2</span>다른 분야에서 영감 찾기 (음악, 건축, 자연)</div>
    <div class="point"><span class="point-num">3</span>제약 조건이 창의력을 키운다</div>
    <div class="point"><span class="point-num">4</span>피드백을 두려워하지 마세요</div>
    <div class="point"><span class="point-num">5</span>산책·명상으로 무의식 활성화</div>
  </div>
  <div class="tip">
    <div class="tip-label">💡 TIP</div>
    <div class="tip-text">"창의력은 근육이다. 쓸수록 강해진다"</div>
  </div>
  <div class="footer">
    <span>@ultimate.design</span>
    <span>Art & Design Series</span>
  </div>
</body></html>
